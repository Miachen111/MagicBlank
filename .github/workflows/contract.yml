name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate shared examples and button regions
        run: python tools/check_contract.py
      - name: Run offline simulation
        run: python tools/simulate_touch.py
